worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include      mime.types;
  default_type application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  # ── Upstream: Docker will automatically add/remove instances ──
  upstream alatyon_app {
    least_conn;                  # send to instance with fewest connections
    server app:3000;             # Docker resolves "app" to all replicas
    keepalive 64;
  }

  # ── Rate limit zones ──────────────────────────────────────
  limit_req_zone  $binary_remote_addr zone=api:10m  rate=60r/m;
  limit_req_zone  $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # ── HTTP → HTTPS redirect ─────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS ─────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Max 50 connections per IP
    limit_conn conn 50;

    # ── Auth endpoints — strict limit ────────────────────────
    location /api/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass         http://alatyon_app;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API endpoints ────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass         http://alatyon_app;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # ── Static files — heavy cache ───────────────────────────
    location /_next/static/ {
      proxy_pass http://alatyon_app;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Everything else ──────────────────────────────────────
    location / {
      proxy_pass         http://alatyon_app;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}